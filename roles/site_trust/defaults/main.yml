---
# The Deevnet Root CA (ADR-0031 §1), from the inventory. Every substrate host
# trusts it at the operating-system level, so tools verify without per-tool CA
# flags. During a re-root the outgoing root stays trusted beside it
# (site_root_ca_previous_files), and an anchor named in site_root_ca_retired
# is removed once nothing uses it (Root of Trust > Custody).
site_trust_roots: "{{ [site_root_ca_file] + (site_root_ca_previous_files | default([])) }}"
site_trust_retired: "{{ site_root_ca_retired | default([]) }}"

# Fedora/RHEL take any name under anchors/; Debian (Proxmox) reads only *.crt.
# The anchor's directory and extension; its name is the file's, without .pem.
site_trust_anchor:
  RedHat: { dir: /etc/pki/ca-trust/source/anchors, ext: .pem }
  Debian: { dir: /usr/local/share/ca-certificates, ext: .crt }
site_trust_update:
  RedHat: [update-ca-trust, extract]
  Debian: [update-ca-certificates]
# The bundle each OS builds from its anchors, which TLS clients read. Fedora 44
# no longer has the old /etc/pki/tls/certs/ca-bundle.crt link; this path is on
# both 43 and 44.
site_trust_bundle:
  RedHat: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
  Debian: /etc/ssl/certs/ca-certificates.crt
