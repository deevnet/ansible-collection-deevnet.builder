---
# Sample dev user — host_vars or group_vars should define dev_users.
# A user the role creates starts with its own name as its password, expired so
# the first login must change it; initial_password overrides the starting value.

dev_users:
  - name: devuser
    primary_group: devuser
    extra_groups:
      - wheel
    home: /home/devuser
    github_keys_url: "https://github.com/devuser.keys"


# HashiCorp repository configuration
hashicorp_repo_baseurl: "https://rpm.releases.hashicorp.com/fedora/$releasever/$basearch/stable"
hashicorp_repo_gpgkey: "https://rpm.releases.hashicorp.com/gpg"
hashicorp_repo_enabled: true
hashicorp_repo_gpgcheck: true
hashicorp_repo_repo_gpgcheck: true

# HashiCorp packages to install
hashicorp_packages:
  - terraform
  - packer

# Terraform CLI configuration (~/.terraformrc) for each dev user.
# Providers are pinned per project in required_providers, not installed here;
# this only gives the CLI a shared provider cache and quiets version checks.
terraform_cli_config_enabled: true
terraform_plugin_cache_dir: ".terraform.d/plugin-cache"   # relative to the user's home
terraform_disable_checkpoint: true

# General dev tool packages
dev_tool_packages:
  - acl
  - git
  # GitHub CLI. Note it does NOT ride on the SSH key that git push uses - the
  # GitHub API needs a token, so `gh auth login` (or GH_TOKEN) is still a
  # per-user step after this installs the binary.
  - gh
  - vim
  - tmux
  - golang
  - nmap-ncat
  - whois
  - sshpass
  # jq and yq are how vault contents and terraform/API JSON get read on the
  # command line, which is most of what operating this estate looks like:
  # reading a TSIG key or a state credential out of the inventory vault, and
  # pulling one field out of `terraform output -json` or a PVE API response.
  #
  # Fedora's yq is mikefarah/yq (Go, v4), NOT the Python jq-wrapper of the same
  # name. It reads YAML natively and takes jq-ish paths; runbooks written for
  # the Python one may need adjusting.
  - jq
  - yq
  - wget
  - curl
  - tftp
  - zip
  - unzip
  - tar
  - tree

# ISO/image building tools
iso_packages:
  - squashfs-tools
  - genisoimage
  - xorriso
  - syslinux

# X11 over SSH (dev_tools.yml)
x11_packages:
  - firefox              # GUI browser for X11 over SSH
  - xorg-x11-xauth       # needed for SSH X11 forwarding
  - xeyes                # X forwarding test app

# Virtualization packages for KVM/libvirt
virtualization_packages:
  - qemu-kvm
  - libvirt
  - libvirt-daemon
  - libvirt-daemon-config-network
  - libvirt-daemon-kvm
  - virt-install
  - virt-manager
  # arm64 machines emulated on this x86 host (TCG): the take-home arm64 qcow2
  # is proven here the way UTM's QEMU backend boots it, the `virt` machine with
  # an arm64 UEFI firmware. Installing these lifts the qemu packages to the
  # same version.
  - qemu-system-aarch64-core
  - edk2-aarch64

# Hugo static site generator (extended version for SCSS/search support)
# Get checksum from: https://github.com/gohugoio/hugo/releases/download/vX.X.X/hugo_X.X.X_checksums.txt
hugo_version: "0.165.0"
hugo_tarball_url: "https://github.com/gohugoio/hugo/releases/download/v{{ hugo_version }}/hugo_extended_{{ hugo_version }}_linux-amd64.tar.gz"
hugo_tarball_sha256: "f43494894cdf4a8630a201d5c828051c77f523cc66bb3938b30806835470ac20"

# proxmoxer for deevnet.mgmt's proxmox_vm role (operator_env.yml).
workstation_proxmoxer_version: "2.3.0"

# The SSH agent under tmux (operator_env.yml): source in files/, destination
# relative to each dev user's home.
workstation_agent_files:
  - { src: tmux.conf, dest: .tmux.conf, mode: "0644" }
  - { src: ssh_rc, dest: .ssh/rc, mode: "0644" }
  - { src: tmux-ssh-agent.sh, dest: .bashrc.d/tmux-ssh-agent.sh, mode: "0644" }
