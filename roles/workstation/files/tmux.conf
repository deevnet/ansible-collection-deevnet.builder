# Keep the SSH agent usable across reconnects.
#
# ~/.ssh/rc points ~/.ssh/ssh_auth_sock at the current connection's agent on
# every SSH login that forwards one. New panes use that fixed path instead of
# the per-connection socket, which disappears when the connection drops.
set-environment -g SSH_AUTH_SOCK "$HOME/.ssh/ssh_auth_sock"

# tmux's default update-environment minus SSH_AUTH_SOCK. By default, attaching
# copies the client's SSH_AUTH_SOCK into the session environment, and a session
# value wins over the global one set above.
set-option -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"
