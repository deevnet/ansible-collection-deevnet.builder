---
# update_watch - the daily update watcher on the Builder (Patch Management v2).
#
# Once a day it asks every substrate host what updates it has waiting, asks the
# Omada controller about its devices' firmware, compares OPNsense's published
# releases with the version discovery last saw on the core router, and writes
# down in a report what is new, which a banner at login points to. It runs as
# its own account with credentials that can read and nothing else:
#   - an SSH key pinned on every host to one read-only program (update_check);
#   - a view-only Omada Open API client;
#   - nothing at all for the core router, whose only firmware privilege could
#     also install updates: the router is watched upstream instead.

update_watch_user: deevnet-watch
update_watch_home: /var/lib/deevnet-watch
update_watch_key: "{{ update_watch_home }}/.ssh/id_ed25519"
# The public half, where update_check reads it on the control node.
update_watch_public_key_file: /etc/deevnet/update-watch.pub

update_watch_script: /usr/local/sbin/deevnet-update-watch
update_watch_config: /etc/deevnet/update-watch.json
update_watch_state: "{{ update_watch_home }}/state.json"

# The hosts it asks, over SSH. The watcher checks itself directly. Hypervisors
# are asked and listed, but are not news: Proxmox VE notifies its own waiting
# updates (CHG-0079).
update_watch_targets: "{{ (groups['management_plane'] | default([]))
                          + (groups['builder'] | default([]))
                          + (groups['hypervisors'] | default([])) }}"
update_watch_quiet_groups: [hypervisors]

# Where the reports go, and the banner that points to them. Nothing is mailed:
# a mobile site's network may block mail, and the report needs no network.
update_watch_report_dir: /srv/updates
update_watch_profile_script: /etc/profile.d/deevnet-updates.sh

# A waiting update is news the day it is first seen, and again after this many
# days if it is still waiting.
update_watch_remind_days: 30

# The Omada controller and a VIEW-ONLY Open API client (role: viewer, created
# by the Owner in the controller). Empty client id means devices are not
# checked, and the report says so.
update_watch_omada_host: "{{ (groups['network_controllers'] | default([]) | intersect(groups['management_plane'] | default([]))) | first | default('') }}"
update_watch_omada_url: "{{ 'https://' ~ hostvars[update_watch_omada_host]['ansible_host'] ~ ':8043' if update_watch_omada_host else '' }}"
update_watch_omada_verify: "{{ site_verify_omada | default(false) }}"
update_watch_omada_client_id: ""
update_watch_omada_client_secret: ""

# The core router, watched upstream: OPNsense's release tags, against the
# version in the newest discovery report.
update_watch_opnsense_tags_url: https://api.github.com/repos/opnsense/core/tags?per_page=50
update_watch_discovery_dir: /srv/discovery
# Discovery runs as the operator on the control node (the Builder), so the
# directory stays theirs; the watcher reads it through its group (setgid).
update_watch_discovery_owner: "{{ lookup('ansible.builtin.env', 'USER') }}"

# When it runs.
update_watch_calendar: daily
update_watch_random_delay: 1h
