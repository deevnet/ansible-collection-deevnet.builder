---
# Turns off the web UI's "No valid subscription" popup at login. Deevnet runs
# the no-subscription repository on purpose, so the popup tells the operator
# nothing at every login. The script does the edit; the apt hook re-runs it
# after every dpkg run, because a proxmox-widget-toolkit upgrade restores the
# original file.

- name: Install the script
  ansible.builtin.copy:
    src: deevnet-pve-nag-off
    dest: "{{ proxmox_node_nag_script }}"
    mode: "0755"
    owner: root
    group: root
  register: _pnn_script
  become: true

- name: Re-run it after every package change
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/86deevnet-pve-nag-off
    mode: "0644"
    owner: root
    group: root
    content: |
      // Managed by deevnet.builder proxmox_node_nag. Edits will be overwritten.
      // A proxmox-widget-toolkit upgrade restores the login popup; take it out again.
      DPkg::Post-Invoke { "if [ -x {{ proxmox_node_nag_script }} ]; then {{ proxmox_node_nag_script }} >/dev/null || true; fi"; };
  become: true

# In check mode the script on the node may be missing or stale; then skip.
- name: Turn the popup off
  ansible.builtin.command:
    argv: "{{ [proxmox_node_nag_script] + (['--check'] if ansible_check_mode else []) }}"
  register: _pnn_nag
  changed_when: _pnn_nag.stdout == 'patched'
  check_mode: false
  become: true
  when: not (ansible_check_mode and _pnn_script is changed)

- name: Say so when the code has changed upstream
  ansible.builtin.fail:
    msg: >-
      The subscription check in proxmoxlib.js no longer matches what
      {{ proxmox_node_nag_script }} looks for - a proxmox-widget-toolkit
      release has changed it. The popup is back until the script is updated.
  when:
    - _pnn_nag is not skipped
    - _pnn_nag.stdout == 'not-found'
