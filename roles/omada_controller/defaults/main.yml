---
# Omada Controller container configuration
# ------------------------------------------------------------------------------

# Container image configuration
# This should match the tarball created by the artifacts role
omada_image_name: "docker.io/mbentley/omada-controller"
omada_image_tag: "6.3.0.45"
omada_tarball_filename: "omada-controller-latest.tar"
omada_tarball_url: "http://127.0.0.1/container-images/omada-controller/{{ omada_tarball_filename }}"

# Container runtime settings
omada_container_name: "omada-controller"

# Container network mode.
#
# Must be "host". Omada device discovery is a broadcast to 255.255.255.255:29810,
# and podman's published-port DNAT only forwards unicast destined to a host
# address - broadcasts are delivered to podman's own port-reservation socket and
# never reach the container. With bridge networking the controller therefore sees
# zero devices even though the APs and switches are broadcasting correctly on the
# same L2 segment.
#
# When this is "host" the port publishing below is skipped: the container binds
# the host's ports directly, and firewalld (configure_firewall.yml) becomes the
# only thing gating access. Keep omada_ports in sync with the firewall lists.
omada_network_mode: "host"

# Network port mappings.
# Only published when omada_network_mode != "host"; otherwise these document the
# ports the container binds directly and should match the firewall lists below.
# Source: Omada, "Which Ports do Omada SDN Controller and Omada Discovery
# Utility Use (above Controller 5.0.15)", updated 08-28-2026,
# https://support.omadanetworks.com/us/document/13090/
omada_ports:
  # Management portal (HTTP)
  - host: 8088
    container: 8088
    protocol: tcp
  # Management portal (HTTPS)
  - host: 8043
    container: 8043
    protocol: tcp
  # Portal HTTPS redirector
  - host: 8843
    container: 8843
    protocol: tcp
  # Controller discovery and adoption (v1)
  - host: 29810
    container: 29810
    protocol: udp
  # Manager connection (v1)
  - host: 29811
    container: 29811
    protocol: tcp
  - host: 29812
    container: 29812
    protocol: tcp
  - host: 29813
    container: 29813
    protocol: tcp
  # Manage devices on v5-adapted firmware
  - host: 29814
    container: 29814
    protocol: tcp
  # From v5.9: device info and packet capture files
  - host: 29815
    container: 29815
    protocol: tcp
  # From v5.9: remote control terminal session
  - host: 29816
    container: 29816
    protocol: tcp
  # Communication between devices and the controller
  - host: 29817
    container: 29817
    protocol: tcp
  # Discovery by the Omada app on the same network
  - host: 27001
    container: 27001
    protocol: udp

# Persistent data directories
omada_data_root: "/opt/omada-controller"
omada_data_dirs:
  - path: "{{ omada_data_root }}/data"
    mode: "0755"
  - path: "{{ omada_data_root }}/work"
    mode: "0755"
  - path: "{{ omada_data_root }}/logs"
    mode: "0755"

# Volume mounts for container
omada_volumes:
  - host: "{{ omada_data_root }}/data"
    container: "/opt/tplink/EAPController/data"
  - host: "{{ omada_data_root }}/work"
    container: "/opt/tplink/EAPController/work"
  - host: "{{ omada_data_root }}/logs"
    container: "/opt/tplink/EAPController/logs"

# Systemd service configuration
omada_systemd_unit_path: "/etc/systemd/system/omada-controller.service"
omada_systemd_enabled: true
omada_systemd_state: "started"

# Environment variables for container
omada_env_vars:
  - "TZ=America/New_York"
  - "MANAGE_HTTP_PORT=8088"
  - "MANAGE_HTTPS_PORT=8043"
  - "PORTAL_HTTP_PORT=8088"
  - "PORTAL_HTTPS_PORT=8843"
  - "SHOW_SERVER_LOGS=true"
  - "SHOW_MONGODB_LOGS=false"

# Firewall configuration
omada_firewall_ports_tcp:
  - 8088
  - 8043
  - 8843
  - 29811
  - 29812
  - 29813
  - 29814
  - 29815
  - 29816
  - 29817

omada_firewall_ports_udp:
  - 29810
  - 27001

# Opened by earlier versions of these lists and absent from Omada's port
# reference: 29814 is TCP only there, and 27002 is not listed at all. Closed on
# every run so a host configured from the old lists converges. Kept in step with
# deevnet.mgmt's omada_controller, which runs the site's controller.
omada_firewall_ports_retired:
  - 29814/udp
  - 27002/tcp

# SELinux configuration
omada_selinux_context: "container_file_t"
