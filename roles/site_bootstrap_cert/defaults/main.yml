---
# A server certificate for something that comes up before OpenBao - the core
# router, the hypervisors - signed on the CONTROL NODE by the bootstrap
# intermediate (ADR-0030 §3). Nothing here touches the target: the caller
# installs the result its own product's way.
#
# Sets site_bootstrap_cert_result: {certificate, chain, private_key}, where
# chain is the leaf then the bootstrap intermediate.

site_bootstrap_cert_common_name: "{{ site_cert_dns_names | first }}"
site_bootstrap_cert_dns_names: "{{ site_cert_dns_names }}"
site_bootstrap_cert_ips: "{{ site_cert_ip_sans }}"

# One year (ADR-0030 §5). RSA: what older device TLS stacks and the vendors'
# own guides expect.
site_bootstrap_cert_days: 365
site_bootstrap_cert_key_size: 2048

site_bootstrap_cert_ca_file: "{{ site_bootstrap_ca_file }}"
site_bootstrap_cert_ca_key: "{{ vault_site_bootstrap_ca_key | default('') }}"
site_bootstrap_cert_root_file: "{{ site_root_ca_file }}"
