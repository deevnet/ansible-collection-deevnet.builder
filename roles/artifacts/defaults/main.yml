---
# Default list of artifacts to fetch if none is provided via inventory.
# Normally overridden in group_vars for builder hosts.
artifacts_to_fetch: []

# Podman container image artifacts to download and save as tarballs.
#
# IMPORTANT: All image names MUST be fully-qualified (include registry prefix).
# Short names like 'nginx:latest' or 'user/repo:tag' will fail because Podman
# requires interactive TTY for short-name resolution, which Ansible cannot provide.
#
# Examples of correct fully-qualified names:
#   - docker.io/library/nginx:latest              # Docker Hub official images
#   - docker.io/mbentley/omada-controller:5.12    # Docker Hub user images
#   - ghcr.io/username/repository:tag             # GitHub Container Registry
#   - quay.io/namespace/image:version             # Quay.io
#   - registry.example.com/image:tag              # Private registry
#
# Each entry requires:
#   - name: Descriptive name for the artifact
#   - upstream_image: FULLY-QUALIFIED image name (registry.io/namespace/image:tag)
#   - dest_subdir: Subdirectory under nginx_artifacts_root
#   - tar_filename: Name for the saved tarball
#   - latest_symlink: (optional) Symlink name for 'latest' version
#
# Example:
# artifacts_podman_images:
#   - name: "omada-controller"
#     upstream_image: "docker.io/mbentley/omada-controller:5.12"
#     dest_subdir: "container-images/omada-controller"
#     tar_filename: "omada-controller-5.12.tar"
#     latest_symlink: "omada-controller-latest.tar"
#
artifacts_podman_images: []

# Root directory for all HTTP-served files
nginx_artifacts_root: /srv/deevnet-http

# Directory tree we want
nginx_artifacts_dirs:
  - iso
  - iso/fedora
  - isos
  - isos/proxmox
  - netboot
  - netboot/fedora
  - pi-images
  - keys
  - keys/ssh
  - keys/gpg
  - misc

# TFTP Staging Configuration
# ------------------------------------------------------------------------------
# When enabled, netboot artifacts are also copied to the TFTP root directory.
# Use this when the artifact server is also a PXE/bootstrap node.
artifacts_tftp_staging_enabled: false
artifacts_tftp_staging_root: /srv/tftp
artifacts_tftp_staging_owner: "root"
artifacts_tftp_staging_group: "root"


# Vhost settings
# ------------------------------------------------------------------------------
# VHOST NOTE:
#
# By default, nginx_artifacts_server_name is set to "_" so that the artifacts
# site works immediately via http://<IP>/ using the default_server flag.
#
# When DNS is introduced (e.g., artifacts.dvntm.deevnet.net), override:
#
#   nginx_artifacts_server_name: "artifacts.dvntm.deevnet.net"
#
# in group_vars or host_vars for the artifact host.
#
# Do NOT change the default here; keep the role generic.
# ------------------------------------------------------------------------------
nginx_artifacts_server_name: "_"
nginx_artifacts_listen_port: 80
nginx_artifacts_default_server: true

# Fedora / RHEL nginx layout
nginx_conf_dir: /etc/nginx
nginx_artifacts_conf_path: "{{ nginx_conf_dir }}/conf.d/artifacts.conf"
nginx_artifacts_site_name: artifacts

# Kickstart Publishing
# ------------------------------------------------------------------------------
# Fedora releases to render builder-node kickstarts for. Each produces
# kickstart/builder-node-<release>.ks on the artifact server.
# Override in inventory to track additional releases.
artifacts_kickstart_releases:
  - "{{ deevnet_fedora_current.release }}"
  - "{{ deevnet_fedora_previous.release }}"

# Release used for the unversioned kickstart/builder-node.ks
artifacts_kickstart_default_release: "{{ deevnet_fedora_current.release }}"

# Proxmox bare-metal bootstrap
# ------------------------------------------------------------------------------
# Generates the two hand-run scripts that take a freshly-installed Proxmox node
# from bare metal to Ansible-manageable. See tasks/publish_pve_bootstrap.yml for
# why this cannot be done with Ansible alone.

# Inventory group to render scripts for.
artifacts_pve_bootstrap_group: hypervisors

# Published under {{ nginx_artifacts_root }}/<dir>/<host>-{netconfig,configure}.sh
artifacts_pve_bootstrap_dir: bootstrap/pve

# Interface key in infrastructure/env to take the MAC and address from.
artifacts_pve_bootstrap_interface: eth0

# PVE's management bridge. The physical NIC is discovered at runtime by MAC.
artifacts_pve_bootstrap_bridge: vmbr0

# Service account the estate uses everywhere; must match a key published in
# artifacts_ssh_keys so the two cannot drift.
artifacts_pve_bootstrap_user: a_autoprov
artifacts_pve_bootstrap_key_name: a_autoprov_rsa

# Resolver for the node. Defaults to the segment gateway (the core router).
artifacts_pve_bootstrap_dns: ""

# A fresh PVE points at the enterprise repo, which 401s without a subscription
# and breaks every apt-get. Set false only if you hold a subscription.
artifacts_pve_bootstrap_no_subscription_repo: true

# Packages the node needs before Ansible and the tenant fabric can work.
artifacts_pve_bootstrap_packages:
  - sudo
  - frr
  - dnsmasq

# Rendered as comments in the script so the reason survives contact with a
# console at 2am.
artifacts_pve_bootstrap_package_notes:
  frr: "EVPN control plane; an SDN EVPN zone will not come up without it"
  dnsmasq: "per-VNet DHCP/DNS for SDN; without it fabric IPAM leases nothing"
