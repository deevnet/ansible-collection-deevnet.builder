---
# update_check - the read-only account the update watcher logs in to
# (Patch Management v2).
#
# The watcher on the Builder (role update_watch) asks every host, once a day,
# what updates it has waiting. On each host it may run exactly one program,
# deevnet-update-check, which reads the package manager's cache and prints it.
# The account has no sudo and no password, and its key works from the watcher's
# address only.

update_check_user: deevnet-watch
update_check_home: /var/lib/deevnet-watch
update_check_path: /usr/local/sbin/deevnet-update-check

# The watcher host, and the address its key may be used from. The watcher is
# the one host in update_watchers.
update_check_watcher: "{{ groups['update_watchers'] | default([]) | first | default('') }}"
update_check_from: "{{ hostvars[update_check_watcher]['ansible_host'] if update_check_watcher else '' }}"

# The watcher's public key, which the update_watch role publishes on the
# watcher. The control node is the Builder, which is the watcher, so it is read
# from there. Its private half never leaves the watcher.
update_check_public_key_file: /etc/deevnet/update-watch.pub

# The health watcher's check (role health_watch on the watcher, INC-0007): a
# second program on the same account, reached through a second key pinned to
# it. Its public half, published by health_watch on the watcher; until it
# exists, only the update watcher's key is pinned.
update_check_health_path: /usr/local/sbin/deevnet-health-check
update_check_health_key_file: /etc/deevnet/health-watch.pub
