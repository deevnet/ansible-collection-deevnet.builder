- hosts: builder
  become: true
  roles:
    - base

- hosts: workstations
  become: true
  roles:
    - workstation

- hosts: artifact_servers
  become: true
  roles:
    - artifacts

# The Builder's controller is the site controller's COLD FALLBACK (ADR-0013).
# The site's controller runs in the network management VM, configured by
# deevnet.mgmt. Management-plane hosts are excluded so this role - with its
# base and artifacts dependencies - can never land on that VM; the Builder only
# matches while it has been put back in network_controllers for a recovery.
- hosts: network_controllers:!management_plane
  become: true
  roles:
    - omada_controller

- hosts: bootstrap_nodes
  become: true
  roles:
    - bootstrap

# Hypervisors get a deliberately narrow baseline, not the `base` role: their OS
# hostname is the PVE node name, and `base` is dnf-based while PVE is Debian.
- hosts: hypervisors
  become: true
  roles:
    - proxmox_node_base
