- hosts: builder
  become: true
  roles:
    - base

- hosts: workstations
  become: true
  roles:
    - workstation

- hosts: artifact_servers
  become: true
  roles:
    - artifacts

- hosts: network_controllers
  become: true
  roles:
    - omada_controller

- hosts: bootstrap_nodes
  become: true
  roles:
    - bootstrap

# Hypervisors get a deliberately narrow baseline, not the `base` role: their OS
# hostname is the PVE node name, and `base` is dnf-based while PVE is Debian.
- hosts: hypervisors
  become: true
  roles:
    - proxmox_node_base
    # Data-disk volume groups, thin pools and PVE storage entries, from
    # proxmox_node_storage in host_vars. Skips nodes that declare none.
    - proxmox_node_storage
