- hosts: builder
  become: true
  roles:
    - base
    # The site root in the OS trust store (ADR-0030 §7), so Ansible, Packer and
    # Terraform on the Builder verify without per-tool CA flags.
    - site_trust

# Before the watchers: they give the operator's account the discovery reports,
# and on a freshly installed Builder that account does not exist until here.
- hosts: workstations
  become: true
  roles:
    - workstation

# The update watcher (Patch Management v2): before every update_check, because
# it makes the key that update_check pins on every host below and in
# deevnet.mgmt's site.yml.
- hosts: update_watchers
  become: true
  roles:
    - role: update_watch
      tags: [update_watch]
    # The health watcher (INC-0007), on the same account and key, asking the
    # same check below for its health mode.
    - role: health_watch
      tags: [health_watch]
    # Read-only patch tools for Claude over MCP, reading what the two watchers
    # above write. Local stdio only: nothing listens.
    - role: patch_mcp
      tags: [patch_mcp]

# The read-only account the update watcher logs in to.
- hosts: builder
  become: true
  roles:
    - role: update_check
      tags: [update_check]

- hosts: artifact_servers
  become: true
  roles:
    - artifacts

# The Builder's controller is the site controller's COLD FALLBACK (ADR-0013).
# The site's controller runs in the network management VM, configured by
# deevnet.mgmt. Management-plane hosts are excluded so this role - with its
# base and artifacts dependencies - can never land on that VM; the Builder only
# matches while it has been put back in network_controllers for a recovery.
- hosts: network_controllers:!management_plane
  become: true
  roles:
    - omada_controller

- hosts: bootstrap_nodes
  become: true
  roles:
    - bootstrap

# Hypervisors get a deliberately narrow baseline, not the `base` role: their OS
# hostname is the PVE node name, and `base` is dnf-based while PVE is Debian.
- hosts: hypervisors
  become: true
  roles:
    - proxmox_node_base
    - site_trust
    # The web UI and API on a site certificate from the bootstrap intermediate
    # (ADR-0030 §3), so clients verify instead of skipping it.
    - role: proxmox_node_cert
      tags: [certs]
    # Data-disk volume groups, thin pools and PVE storage entries, from
    # proxmox_node_storage in host_vars. Skips nodes that declare none.
    - proxmox_node_storage
    # Installer ISOs in local:iso, from the artifact server, for template
    # builds (proxmox_node_isos in group_vars).
    - role: proxmox_node_isos
      tags: [isos]
    # Proxmox roles, users, tokens (verified only) and ACLs that automation and
    # the Deevnet API use, from proxmox_node_access in host_vars.
    - role: proxmox_node_access
      tags: [proxmox-access]
    # Where the node's notifications go: one email target and one rule from
    # inventory, instead of the installer's root@pam address.
    - role: proxmox_node_notify
      tags: [notifications]
    # No "No valid subscription" popup at web UI login; kept off across
    # proxmox-widget-toolkit upgrades by an apt hook.
    - role: proxmox_node_nag
      tags: [nag]
    # The read-only account the update watcher logs in to. Proxmox VE mails its
    # own waiting updates; the watcher records them without mailing.
    - role: update_check
      tags: [update_check]
