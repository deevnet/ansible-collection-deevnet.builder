namespace: deevnet
name: builder
version: 1.0.0
readme: README.md
authors:
  - Chris Deever
license:
  - Apache-2.0
tags:
  - ansible
  - infrastructure
  - provisioning
  - packer
  - terraform
  - pxe
  - tftp
  - nginx
  - linux
  - automation
  - baremetal
  - virtual
description: >
  Roles for building and bootstrapping infrastructure across physical,
  virtual, and embedded platforms. Includes developer host setup, image
  builder configuration, artifact hosting, and PXE provisioning—providing
  a complete toolkit for exploring Infrastructure as Code workflows with
  Ansible, Packer, Terraform, nginx, and TFTP.
dependencies:
  ansible.posix: ">=1.5.0"
  # npm, in the workstation role. Below 11, as in collections/requirements.yml.
  community.general: ">=8.0.0,<11.0.0"

# Kept out of the tarball. .ansible holds the collection installed from the
# previous tarball (make install-dev), so without this each build packed every
# earlier one inside it.
build_ignore:
  - .ansible
  - "*.tar.gz"
  - .deps.stamp
